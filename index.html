<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para kay Khate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: black;
            width: 100%;
            height: 100vh;
            overflow: hidden; 
            font-family: 'Arial Black', sans-serif;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
        }

        #content {
            display: none;
            width: 100%;
            height: 100vh;
            background: black;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #text-layer {
            width: 100%;
            /* ETO ANG MAGIC: clamp(min, preferred, max) */
            /* Hindi na siya lalampas sa 18px sa PC, at hindi bababa sa 8px sa CP */
            font-size: clamp(8px, 1.2vw, 18px); 
            
            line-height: 0.85;
            letter-spacing: -0.02em;
            font-weight: 900;
            text-transform: uppercase;
            word-break: break-all;
            text-align: justify;
            color: transparent;

            background-image: url('love.jpg');
            background-size: contain; 
            background-position: top center;
            background-repeat: no-repeat;
            background-attachment: local;
            
            -webkit-background-clip: text;
            background-clip: text;
            
            /* Enhanced contrast para kitang-kita ang feature ng mukha */
            filter: contrast(1.4) brightness(1.1);
        }

        .btn-tap { border: 2px solid white; padding: 12px 30px; border-radius: 50px; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="step1" class="overlay" onclick="start()">
        <h1>CLICK TO REVEAL 💖</h1>
        <div class="btn-tap">OPEN</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="content">
        <div id="text-layer"></div>
    </div>

    <script>
        function start() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.body.style.overflow = 'auto';
            
            const audio = document.getElementById("bgMusic");
            audio.play().catch(e => {});

            const layer = document.getElementById('text-layer');
            const text = "ILOVEYOU";
            
            // Mas pinarami para siguradong puno hanggang baba
            layer.innerText = text.repeat(80000); 
        }
    </script>
</body>
</html>
