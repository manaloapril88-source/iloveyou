<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        /* Overlay bago i-open ang gift */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
            cursor: pointer;
            text-align: center;
        }

        .ascii-art {
            display: none; /* Nakatago muna hanggang di naki-click */
            background-image: url('love.jpg'); 
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: top center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 6px; 
            line-height: 0.75;
            letter-spacing: -2px;
            width: 100%;
            display: inline-block;
            word-break: break-all;
            text-align: justify;
        }

        @media (max-width: 600px) {
            .ascii-art {
                font-size: 4px;
                line-height: 0.7;
                letter-spacing: -1.5px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startEverything()">
        <div>
            <h2 style="font-weight: 100;">Click to Open Your Gift 🎁</h2>
            <p style="font-size: 12px; opacity: 0.6;">(Turn on your volume)</p>
        </div>
    </div>

    <audio id="mySong" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="ascii-art" id="textWall"></div>

    <script>
        // 1. Fill the wall with text
        const container = document.getElementById('textWall');
        const textToRepeat = "iloveyou";
        let longText = "";
        for (let i = 0; i < 400000; i++) {
            longText += textToRepeat;
        }
        container.innerText = longText;

        // 2. Function para mag-play ang music at lumabas ang image
        function startEverything() {
            // I-play ang music
            const audio = document.getElementById('mySong');
            audio.play();

            // Itago ang overlay
            document.getElementById('overlay').style.display = 'none';

            // Ipakita ang ASCII image
            container.style.display = 'inline-block';
        }
    </script>

</body>
</html>
