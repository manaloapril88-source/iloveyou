<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ILOVEYOU Portrait</title>

<style>
body{
 background:black;
 color:white;
 font-family: monospace;
 white-space: pre;
 margin:0;
}

#labas{
 font-size:8px;
 line-height:8px;
 letter-spacing:1px;
}
</style>

</head>
<body>

<pre id="labas"></pre>

<script>

const out = document.getElementById("labas")
const pic = new Image()
pic.src = "love.jpg"   // same folder dapat

pic.onload = function(){

 let canvas = document.createElement("canvas")
 let ctx = canvas.getContext("2d")

 let W = 200               // mas malinaw
 let ratio = pic.height / pic.width

 canvas.width = W
 canvas.height = W * ratio * 0.55   // fix vertical stretch

 ctx.drawImage(pic,0,0,canvas.width,canvas.height)

 let data = ctx.getImageData(0,0,canvas.width,canvas.height).data

 let word = "ILOVEYOU"
 let index = 0
 let result = ""

 for(let y=0; y<canvas.height; y+=2){
  for(let x=0; x<canvas.width; x+=2){

   let i = (y*canvas.width + x)*4
   let r = data[i]
   let g = data[i+1]
   let b = data[i+2]

   // better grayscale formula
   let brightness = 0.299*r + 0.587*g + 0.114*b

   if(brightness < 170){
     result += word[index % word.length]
     index++
   } else {
     result += " "
   }

  }
  result += "\n"
 }

 out.textContent = result
}

</script>

</body>
</html>
