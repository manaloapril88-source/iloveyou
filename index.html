<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pure ILOVEYOU Portrait</title>

<style>
body{
 background:black;
 margin:0;
 overflow:hidden;
}

#labas{
 font-family: monospace;
 font-size:6px;
 line-height:6px;
 white-space:pre;
 color:#ffffff;
}
</style>

</head>
<body>

<pre id="labas"></pre>

<script>

const out = document.getElementById("labas")
const img = new Image()
img.src = "love.jpg"

img.onload = function(){

 let canvas = document.createElement("canvas")
 let ctx = canvas.getContext("2d")

 let width = 350   // mataas resolution
 let scale = img.height / img.width

 canvas.width = width
 canvas.height = width * scale

 ctx.drawImage(img, 0, 0, canvas.width, canvas.height)

 let data = ctx.getImageData(0,0,canvas.width,canvas.height).data

 let text = ""
 let word = "ILOVEYOU"
 let index = 0

 for(let y = 0; y < canvas.height; y++){
   for(let x = 0; x < canvas.width; x++){

     let i = (y * canvas.width + x) * 4
     let r = data[i]
     let g = data[i+1]
     let b = data[i+2]

     let brightness = (r+g+b)/3

     if(brightness < 180){
       text += word[index % word.length]
       index++
     } else {
       text += " "
     }

   }
   text += "\n"
 }

 out.textContent = text
}

</script>

</body>
</html>
