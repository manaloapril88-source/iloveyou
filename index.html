<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para kay Khate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: black;
            width: 100%;
            overflow: hidden; 
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 30px;
        }

        #content {
            display: none;
            width: 100vw;
            background: black;
        }

        #text-layer {
            width: 100%;
            font-family: 'Courier New', monospace; /* Mas malinis na font para di magulo */
            font-weight: 900; 
            word-break: break-all;
            text-align: justify;
            color: transparent;

            /* --- FIXING THE IMAGE VISIBILITY --- */
            background-image: url('love.jpg');
            background-size: contain; /* Para sakto sa screen at di ma-stretch */
            background-position: top center;
            background-repeat: no-repeat;
            background-attachment: scroll; 
            
            -webkit-background-clip: text;
            background-clip: text;
            
            /* NILUWAGAN KO TO PARA MAKITA YUNG MUKHA */
            font-size: 8px; 
            line-height: 0.9;
            letter-spacing: -0.5px;
        }

        @media (max-width: 768px) {
            #text-layer {
                font-size: 6px; /* Saktong size lang para sa mobile */
                line-height: 0.85;
                letter-spacing: -0.2px;
            }
        }

        .btn-tap { border: 2px solid white; padding: 12px 25px; border-radius: 30px; margin-top: 20px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="step1" class="overlay" onclick="revealGift()">
        <h1>CLICK TO REVEAL 💖</h1>
        <div class="btn-tap">OPEN GIFT</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="content">
        <div id="text-layer"></div>
    </div>

    <script>
        const audio = document.getElementById("bgMusic");

        function revealGift() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.body.style.overflow = 'auto'; 

            const layer = document.getElementById('text-layer');
            const word = "iloveyou";
            
            // Bawasan natin ng konti yung repeat para di ma-crash ang browser
            layer.innerText = word.repeat(200000); 
            
            audio.play();
        }
    </script>
</body>
</html>
