<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para kay Khate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: black;
            width: 100%;
            height: 100vh;
            overflow: hidden; 
            font-family: 'Arial Black', 'Arial Bold', Impact, sans-serif;
        }

        /* OVERLAY (Start Screen) */
        .overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        .btn-tap { 
            border: 2px solid white; 
            padding: 15px 40px; 
            border-radius: 50px; 
            margin-top: 20px; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* MAIN AREA */
        #content {
            display: none;
            width: 100%;
            height: 100vh;
            background: black;
            overflow: auto; 
        }

        /* TEXT PORTRAIT SETTINGS */
        #text-layer {
            width: 100%;
            min-height: 100vh;
            
            /* DITO ANG SOLUSYON SA STATIC SA PC */
            /* Ang font size ay 1.8% ng width ng screen. 
               Kaya sa PC malaki ang text, sa CP maliit. 
               Pero SAME ang itsura at bilang ng letters per line. */
            font-size: 1.8vw; 
            
            /* TIGHT SPACING PARA BUO ANG IMAGE */
            line-height: 0.8; 
            letter-spacing: -0.05em; 
            
            font-weight: 900; 
            text-transform: uppercase;
            word-break: break-all;
            text-align: center;
            color: transparent;

            /* IMAGE BACKGROUND */
            background-image: url('love.jpg'); /* Siguraduhin na tama ang filename */
            
            /* FORCE FULL SCREEN COVERAGE */
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: local; 
            
            -webkit-background-clip: text;
            background-clip: text;
            
            /* Contrast Boost para lumitaw ang mukha */
            filter: contrast(1.3) brightness(1.2); 
        }

        /* OPTIONAL: Kunting adjust sa mobile kung masyadong malaki */
        @media (max-width: 768px) {
            #text-layer {
                font-size: 2.5vw; /* Mas malaki konti sa mobile para readable */
            }
        }
    </style>
</head>
<body>

    <div id="step1" class="overlay" onclick="revealGift()">
        <h1>CLICK TO OPEN 🎁</h1>
        <div class="btn-tap">Reveal Khate</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="content">
        <div id="text-layer"></div>
    </div>

    <script>
        const audio = document.getElementById("bgMusic");

        function revealGift() {
            const overlay = document.getElementById('step1');
            const content = document.getElementById('content');
            const layer = document.getElementById('text-layer');
            
            overlay.style.display = 'none';
            content.style.display = 'block';
            
            // Audio Play
            audio.play().catch(e => console.log("Audio needs interaction"));

            // TEXT FILLER
            const text = "ILOVEYOU"; 
            
            // Mas kaunti na ang kailangan na repeat kasi malaki na ang font sa PC
            // Ito ay sapat na para punuin ang screen nang hindi nagla-lag
            layer.innerText = text.repeat(15000); 
        }
    </script>
</body>
</html>
