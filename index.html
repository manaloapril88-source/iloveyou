<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para sa Paborito Ko</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            font-family: sans-serif;
        }

        .wrapper {
            position: relative;
            display: inline-block; /* Para sumunod ang scroll sa size ng image */
            width: 100%;
            max-width: 600px; /* Mas pino tingnan pag hindi sobrang lapad */
        }

        #textWall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Text Settings */
            font-family: monospace;
            font-weight: 900;
            font-size: 6px; 
            line-height: 0.8;
            letter-spacing: -1px;
            word-break: break-all;
            text-align: justify;
            
            /* Magic Mask */
            background-image: url('love.jpg'); 
            background-size: 100% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            pointer-events: none;
        }

        /* Ang "ghost" image para makuha ang saktong haba ng scroll */
        .base-image {
            width: 100%;
            display: block;
            visibility: hidden; /* Nakatago pero nandun ang space */
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="start()">
        <h1>CLICK MO 'TO 💖</h1>
    </div>

    <audio id="bgMusic" loop src="song.mp3"></audio>

    <div class="wrapper">
        <img src="love.jpg" class="base-image">
        <div id="textWall"></div>
    </div>

    <script>
        function start() {
            document.getElementById('bgMusic').play();
            document.getElementById('overlay').style.display = 'none';
            
            const wall = document.getElementById('textWall');
            const phrase = "iloveyou";
            
            // Mas pino ang calculation: Pinupuno ang div hanggang sa mapuno ang space
            let content = "";
            const totalChars = 150000; // Sapat na 'to para sa 1080p na image
            wall.innerText = phrase.repeat(totalChars);
        }
    </script>
</body>
</html>
