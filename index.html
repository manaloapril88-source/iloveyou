<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para sa Paborito Ko</title>
    <style>
        /* RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: black;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden; /* Bawal ang scroll sa gilid */
            width: 100%;
        }

        /* --- OVERLAYS --- */
        #intro-overlay, #message-overlay {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }

        #message-overlay { display: none; } 

        /* --- MAIN CONTAINER --- */
        /* Ito ang trick: Ang container na 'to ay kasing laki lang ng image */
        .main-wrapper {
            position: relative;
            width: 100%; /* Sasakupin ang buong lapad para ZOOMED look */
            max-width: 800px; /* Optional: para di masyadong sabog sa super wide monitor */
            margin: 0 auto; /* Center sa screen */
            display: none; /* Nakatago hanggat di tapos ang intro */
        }

        /* Ang Ghost Image: Ito ang magdidikta ng height ng scroll */
        #reference-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0; /* Invisible siya, pero siya ang nagtutulak ng content */
        }

        /* Ang Text Wall: Nakapatong exactly sa Ghost Image */
        #text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* CRITICAL: Puputulin ang sobrang text */
            
            /* Text Styling - Zoomed & Detailed */
            font-family: monospace;
            font-weight: 900;
            font-size: 9px; /* Medyo pinalaki ko para mas readable pero detailed pa rin */
            line-height: 0.8; 
            letter-spacing: -1px;
            word-break: break-all;
            text-align: justify;
            color: transparent; /* Transparent kasi image ang kulay */

            /* Image Masking Logic */
            background-image: url('love.jpg');
            background-size: 100% auto; /* Mag-aadjust kasabay ng reference image */
            background-repeat: no-repeat;
            background-position: top center;
            
            /* Magic Effect */
            -webkit-background-clip: text;
            background-clip: text;
            
            pointer-events: none; 
        }

        h1 { margin-bottom: 15px; letter-spacing: 2px; }
        p { font-size: 14px; opacity: 0.7; }

    </style>
</head>
<body>

    <div id="intro-overlay" onclick="toMessage()">
        <h1>CLICK TO OPEN 🎁</h1>
        <p>(Please turn up your volume 🔊)</p>
    </div>

    <div id="message-overlay" onclick="startGift()">
        <h1 style="color: #ff4d4d;">You're my favorite person.</h1>
        <h3 style="color: white; font-weight: normal; margin-bottom: 20px;">I know na hindi ito maganda pero sana nagustuhan mo.</h3>
        <p style="border: 1px solid white; padding: 10px 20px; border-radius: 20px;">Tap here to open</p>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper" id="content">
        <img src="love.jpg" id="reference-img">
        
        <div id="text-layer"></div>
    </div>

    <script>
        function toMessage() {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('message-overlay').style.display = 'flex';
        }

        function startGift() {
            // 1. Play Music (Interaction required kaya dito nilagay)
            var audio = document.getElementById("bgMusic");
            audio.play().catch(error => {
                console.log("Audio play failed: " + error);
            });

            // 2. Hide Message, Show Content
            document.getElementById('message-overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // 3. Generate Text
            fillScreen();
        }

        function fillScreen() {
            const layer = document.getElementById('text-layer');
            const text = "iloveyou";
            
            // LOGIC FIX:
            // Hindi na tayo magbibilang. 
            // Basta pupunuin natin ng sobrang daming text.
            // Dahil naka 'overflow: hidden' ang CSS, kusa siyang mapuputol sa dulo ng image.
            
            let bigText = text.repeat(100000); 
            layer.innerText = bigText;
        }
    </script>

</body>
</html>
