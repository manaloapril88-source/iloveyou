            background: black;

            text-align: center;

            background-repeat: no-repeat;
            background-position: top center;
            background-attachment: scroll; 
            
            -webkit-background-clip: text;
            background-clip: text;
            
            font-size: 5px;
            line-height: 0.8;
            letter-spacing: -1px;
        }

        @media (max-width: 768px) {
            #text-dump { font-size: 4px; line-height: 0.75; }
        }

        h1 { font-size: 1.5rem; margin-bottom: 20px; pointer-events: none; }

            text-transform: uppercase;
            pointer-events: none; /* Para ang click ay dumiretso sa overlay div */
