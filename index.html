<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For you Khate💗</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            /* Tinatanggal ang scroll sa body para sa wrapper lang ang scroll */
            overflow: hidden; 
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* Dito natin lilitaw ang zoom at scroll control */
        .scroll-container {
            width: 100vw;
            height: 100vh;
            overflow-y: auto; /* Dito lang ang scroll */
            overflow-x: hidden;
        }

        .wrapper {
            position: relative;
            width: 100%;
            max-width: 600px; /* Standard portrait width */
            margin: 0 auto;
            line-height: 0;
        }

        #textWall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Text Settings - Zoomed and Fine */
            font-family: monospace;
            font-weight: 900;
            font-size: 5px; /* Ginawa kong 5px para mas zoomed/pino */
            line-height: 0.8;
            letter-spacing: -1px;
            word-break: break-all;
            text-align: justify;
            
            /* Image Masking */
            background-image: url('love.jpg'); 
            background-size: cover; /* Eto ang nagpapa-zoom sa image sa loob ng text */
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            pointer-events: none;
            z-index: 2;
        }

        /* Ito ang magsasabi sa browser kung kailan titigil ang scroll */
        .base-image {
            width: 100%;
            height: auto;
            display: block;
            visibility: hidden; /* Guide lang siya */
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="start()">
        <h1 style="font-weight: 100;">CLICK TO VIEW</h1>
    </div>

    <audio id="bgMusic" loop src="song.mp3"></audio>

    <div class="scroll-container">
        <div class="wrapper">
            <img src="love.jpg" class="base-image" id="guideImg">
            <div id="textWall"></div>
        </div>
    </div>

    <script>
        function start() {
            document.getElementById('bgMusic').play();
            document.getElementById('overlay').style.display = 'none';
            
            const wall = document.getElementById('textWall');
            const phrase = "iloveyou";
            
            // Mas pino na loop para punuin ang screen base sa height ng image
            // Gagamit tayo ng mas malaking number para sigurado hanggang dulo
            let content = "";
            const totalChars = 250000; 
            wall.innerText = phrase.repeat(totalChars);
        }
    </script>
</body>
</html>
