<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para sa Paborito Ko</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
       
        body {
            background-color: black;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }
        /* --- OVERLAYS --- */
        #intro-overlay, #message-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            text-align: center;
            padding: 30px;
        }
        #message-overlay { display: none; }
        /* --- MAIN CONTAINER --- */
        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 100vw;
            margin: 0 auto;
            display: none;
        }
        #reference-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
        }
        #text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
           
            font-family: monospace;
            font-weight: 900;
            word-break: break-all;
            text-align: justify;
            color: transparent;
            background-image: url('love.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top center;
            -webkit-background-clip: text;
            background-clip: text;
            pointer-events: none;
            font-size: 8px;
            line-height: 0.8;
            letter-spacing: -1px;
        }
        @media (max-width: 768px) {
            #text-layer {
                font-size: 4px;
                line-height: 0.75;
                letter-spacing: -0.5px;
            }
            h1 { font-size: 1.2rem; }
            p { font-size: 12px; }
        }
        h1 { margin-bottom: 15px; letter-spacing: 2px; }
        .btn-tap { 
            border: 1px solid white; 
            padding: 12px 28px; 
            border-radius: 30px; 
            margin-top: 25px; 
            font-size: 1.1rem;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div id="intro-overlay" onclick="toMessage()">
        <h1>CLICK TO OPEN 🎁</h1>
        <p>(Please turn up your volume 🔊)</p>
    </div>

    <div id="message-overlay" onclick="startGift()">
        <h1 style="color: #ff4d4d;">You're my favorite person.</h1>
        <h3 style="color: white; font-weight: normal; margin-bottom: 20px;">I know na hindi ito maganda pero sana nagustuhan mo.</h3>
        <p class="btn-tap">Tap here to see the surprise →</p>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="main-wrapper" id="content">
        <img src="love.jpg" id="reference-img">
        <div id="text-layer"></div>
    </div>

    <script>
        function toMessage() {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('message-overlay').style.display = 'flex';
        }

        async function startGift() {
            const audio = document.getElementById("bgMusic");
            
            try {
                // Most important: play() directly inside the click/tap handler
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    await playPromise;  // wait for it to actually start
                    console.log("Audio is playing!");
                }
            } catch (err) {
                console.error("Audio play failed:", err);
                // Optional: pwede kang maglagay ng fallback message
                // alert("Audio didn't play automatically. Try tapping again or check your volume.");
            }

            // Hide overlay & show content kahit hindi mag-play ang audio
            document.getElementById('message-overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            fillScreen();
        }

        function fillScreen() {
            const layer = document.getElementById('text-layer');
            const text = "iloveyou";
            // Mas efficient na repeat count (150k masyadong sobra, pero okay lang)
            layer.innerText = text.repeat(80000);  
        }
    </script>
</body>
</html>
