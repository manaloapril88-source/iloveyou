<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow-x: hidden;
        }

        .ascii-art {
            /* 1. Palitan ang filename kung kailangan */
            background-image: url('love.jpg'); 
            
            /* 2. Fix para sumama sa scroll */
            background-size: 100% auto; /* Kakasya sa width, auto ang haba */
            background-repeat: no-repeat;
            background-position: top center;
            background-attachment: scroll; /* Ito ang binago para sumama sa scroll */

            /* 3. Text Masking */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            /* 4. Font Styling */
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 8px; 
            line-height: 0.85;
            letter-spacing: -1px;
            
            width: 100%;
            /* Pinapahaba ang div para magkasya yung buong image habang nag-scroll */
            min-height: 500vh; 
            word-break: break-all;
            text-align: justify;
        }

        @media (max-width: 600px) {
            .ascii-art {
                font-size: 5px;
                line-height: 0.7;
            }
        }
    </style>
</head>
<body>

    <div class="ascii-art" id="textWall"></div>

    <script>
        const container = document.getElementById('textWall');
        const textToRepeat = "iloveyou";
        
        // Dinamihan ko lalo ang repeat para hindi magkulang ang text hanggang dulo ng scroll
        container.innerText = textToRepeat.repeat(200000);
    </script>

</body>
</html>
