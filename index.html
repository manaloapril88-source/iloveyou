<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para sa Paborito Ko</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: black;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        /* --- OVERLAYS --- */
        #intro-overlay, #message-overlay, #music-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            text-align: center;
            padding: 30px;
        }

        #message-overlay, #music-overlay { display: none; } 

        .main-wrapper {
            position: relative;
            width: 100%; 
            margin: 0 auto;
            display: none;
        }

        #reference-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
        }

        #text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: monospace;
            font-weight: 900;
            word-break: break-all;
            text-align: justify;
            color: transparent;
            background-image: url('love.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top center;
            -webkit-background-clip: text;
            background-clip: text;
            pointer-events: none; 
            font-size: 8px;
            line-height: 0.8; 
            letter-spacing: -1px;
        }

        @media (max-width: 768px) {
            #text-layer {
                font-size: 4px;
                line-height: 0.75;
                letter-spacing: -0.5px;
            }
            h1 { font-size: 1.4rem; }
            p { font-size: 14px; }
        }

        h1 { margin-bottom: 15px; letter-spacing: 2px; }
        .btn-tap { border: 1px solid white; padding: 12px 25px; border-radius: 30px; margin-top: 20px; font-weight: bold; }
        .khate-text { color: #ff4d4d; font-style: italic; }
        #loading-msg { font-size: 10px; margin-top: 10px; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="intro-overlay" onclick="toMessage()">
        <h1>CLICK TO OPEN 🎁</h1>
        <p>(Please turn up your volume 🔊)</p>
    </div>

    <div id="message-overlay" onclick="toMusic()">
        <h1 style="color: #ff4d4d;">You're my favorite person.</h1>
        <h3 style="color: white; font-weight: normal; margin-bottom: 20px;">I know na hindi ito maganda pero sana nagustuhan mo.</h3>
        <p class="btn-tap">Next</p>
    </div>

    <div id="music-overlay" onclick="startGift()">
        <h1 style="line-height: 1.5;">Play your favorite music and enjoy <span class="khate-text">khate!</span></h1>
        <p class="btn-tap" id="reveal-btn">Tap to reveal 💖</p>
        <p id="loading-msg">Wait lang, loading music...</p>
    </div>

    <audio id="bgMusic" preload="auto" loop>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="main-wrapper" id="content">
        <img src="love.jpg" id="reference-img">
        <div id="text-layer"></div>
    </div>

    <script>
        const music = document.getElementById("bgMusic");
        const loadingMsg = document.getElementById("loading-msg");

        // Sinisilip kung ready na yung 5 min music
        music.oncanplaythrough = function() {
            loadingMsg.innerText = "Music ready! 🎵";
        };

        function toMessage() {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('message-overlay').style.display = 'flex';
            // Start loading in background as early as possible
            music.load(); 
        }

        function toMusic() {
            document.getElementById('message-overlay').style.display = 'none';
            document.getElementById('music-overlay').style.display = 'flex';
        }

        function startGift() {
            // Force play with a promise check
            const playPromise = music.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Music started! Proceed to reveal
                    revealContent();
                }).catch(error => {
                    console.log("Playback failed:", error);
                    // Kahit ayaw tumunog (error), ipakita pa rin yung portrait
                    revealContent();
                    alert("Click anywhere to force play the music!");
                });
            }
        }

        function revealContent() {
            document.getElementById('music-overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            fillScreen();
        }

        function fillScreen() {
            const layer = document.getElementById('text-layer');
            const text = "iloveyou";
            layer.innerText = text.repeat(200000); 
        }

        // Emergency click to play (back-up)
        window.onclick = function() {
            if (music.paused && document.getElementById('content').style.display === 'block') {
                music.play();
            }
        };
    </script>
</body>
</html>
