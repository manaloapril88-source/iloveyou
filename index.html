<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para sa Paborito Ko</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
       
        body {
            background-color: black;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100dvh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- OVERLAYS --- */
        #intro-overlay, #message-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 30px;
            cursor: pointer;
            pointer-events: auto;
        }
        #message-overlay { display: none; }

        /* --- MAIN CONTAINER --- */
        .main-wrapper {
            position: relative;
            width: 100%;
            height: 100dvh;
            margin: 0 auto;
            display: none;
        }
        #reference-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
        }
        #text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: monospace;
            font-weight: 900;
            word-break: break-all;
            text-align: justify;
            color: transparent;
            background-image: url('love.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top center;
            -webkit-background-clip: text;
            background-clip: text;
            pointer-events: none;
            font-size: 8px;
            line-height: 0.8;
            letter-spacing: -1px;
        }

        @media (max-width: 768px) {
            #text-layer {
                font-size: 4px;
                line-height: 0.75;
                letter-spacing: -0.5px;
            }
            h1 { font-size: 1.6rem; }
            h3 { font-size: 1.1rem; }
        }

        h1 { margin-bottom: 20px; letter-spacing: 2px; }
        
        .btn-tap {
            border: 2px solid white;
            padding: 20px 50px;
            border-radius: 50px;
            background: rgba(255, 77, 77, 0.3);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            min-width: 85%;
            max-width: 95%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            pointer-events: auto;
            z-index: 1002;
        }

        .btn-tap:active {
            background: rgba(255, 77, 77, 0.7);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h1>CLICK TO OPEN 🎁</h1>
        <p>(Please turn up your volume 🔊)</p>
    </div>

    <div id="message-overlay">
        <h1 style="color: #ff4d4d;">You're my favorite person.</h1>
        <h3 style="color: white; font-weight: normal; margin-bottom: 35px;">
            I know na hindi ito maganda pero sana nagustuhan mo.
        </h3>
        <button class="btn-tap" id="surpriseBtn">
            Tap here to see the surprise →
        </button>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="main-wrapper" id="content">
        <img src="love.jpg" id="reference-img">
        <div id="text-layer"></div>
    </div>

    <script>
        // Intro overlay click/tap
        const intro = document.getElementById('intro-overlay');
        intro.addEventListener('click', toMessage);
        intro.addEventListener('touchend', (e) => {
            e.preventDefault();
            toMessage();
        }, { passive: false });

        function toMessage() {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('message-overlay').style.display = 'flex';
        }

        // Message overlay + button handling
        const messageOverlay = document.getElementById('message-overlay');
        const surpriseBtn = document.getElementById('surpriseBtn');

        // Make whole overlay tappable as backup
        messageOverlay.addEventListener('click', startGift);
        messageOverlay.addEventListener('touchend', (e) => {
            e.preventDefault();
            startGift();
        }, { passive: false });

        // Button specific (primary trigger)
        surpriseBtn.addEventListener('click', startGift);
        surpriseBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            startGift();
        }, { passive: false });

        async function startGift() {
            const audio = document.getElementById("bgMusic");
            
            try {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    await playPromise;
                    console.log("Audio started!");
                }
            } catch (err) {
                console.error("Audio play failed:", err);
                // Optional: alert("Audio hindi nag-play. Subukang i-tap ulit o check volume.");
            }

            document.getElementById('message-overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            fillScreen();
        }

        function fillScreen() {
            const layer = document.getElementById('text-layer');
            const text = "iloveyou";
            layer.innerText = text.repeat(60000);
        }
    </script>
</body>
</html>
