<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para sa Paborito Ko</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
       
        html, body {
            background-color: black;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* OVERLAYS - ginawang fully tappable */
        #intro-overlay, #message-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 30px;
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
        }
        #message-overlay { display: none; }

        .main-wrapper {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: none;
        }
        #reference-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
        }
        #text-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            font-family: monospace;
            font-weight: 900;
            word-break: break-all;
            text-align: justify;
            color: transparent;
            background-image: url('love.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top center;
            -webkit-background-clip: text;
            background-clip: text;
            pointer-events: none;
            font-size: 8px;
            line-height: 0.8;
            letter-spacing: -1px;
        }

        @media (max-width: 768px) {
            #text-layer {
                font-size: 4px;
                line-height: 0.75;
                letter-spacing: -0.5px;
            }
            h1 { font-size: 1.6rem; }
            h3 { font-size: 1.1rem; }
        }

        h1 { margin-bottom: 20px; letter-spacing: 2px; }

        /* Button styles - mas visible at tappable */
        .btn-tap {
            border: 2px solid white;
            padding: 20px 50px;
            border-radius: 50px;
            background: rgba(255, 77, 77, 0.3);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            min-width: 85%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            pointer-events: auto;
            z-index: 1002;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .btn-tap:active,
        .btn-tap:focus {
            transform: scale(0.95);
            background: rgba(255, 77, 77, 0.7);
            outline: none;
        }

        /* Fallback para sa iOS quirks: whole overlay tappable */
        #message-overlay.tappable {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h1>CLICK TO OPEN 🎁</h1>
        <p>(Please turn up your volume 🔊)</p>
    </div>

    <div id="message-overlay">
        <h1 style="color: #ff4d4d;">You're my favorite person.</h1>
        <h3 style="color: white; font-weight: normal; margin-bottom: 35px;">
            I know na hindi ito maganda pero sana nagustuhan mo.
        </h3>
        <button class="btn-tap" id="surpriseBtn">
            Tap here to see the surprise →
        </button>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="main-wrapper" id="content">
        <img src="love.jpg" id="reference-img">
        <div id="text-layer"></div>
    </div>

    <script>
        function toMessage() {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('message-overlay').style.display = 'flex';
        }

        async function startGift() {
            const audio = document.getElementById("bgMusic");
            
            try {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    await playPromise;
                    console.log("Audio nag-play na!");
                }
            } catch (err) {
                console.error("Audio error:", err);
            }

            document.getElementById('message-overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            fillScreen();
        }

        function fillScreen() {
            document.getElementById('text-layer').innerText = "iloveyou".repeat(60000);
        }

        // Event listeners - priority sa button, fallback sa overlay
        const intro = document.getElementById('intro-overlay');
        intro.addEventListener('click', toMessage);
        intro.addEventListener('touchend', e => { e.preventDefault(); toMessage(); }, { passive: false });

        const overlay = document.getElementById('message-overlay');
        const btn = document.getElementById('surpriseBtn');

        // Button primary
        btn.addEventListener('click', startGift);
        btn.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation(); // iwas sa double fire
            startGift();
        }, { passive: false });

        // Whole overlay fallback (para siguradong may matamaan)
        overlay.addEventListener('click', startGift);
        overlay.addEventListener('touchend', e => {
            // Only trigger if tap is not on button (avoid double)
            if (e.target === overlay || e.target === document.querySelector('h1') || e.target === document.querySelector('h3')) {
                e.preventDefault();
                startGift();
            }
        }, { passive: false });
    </script>
</body>
</html>
