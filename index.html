<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para kay Khate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: black;
            width: 100%;
            height: 100vh;
            overflow: hidden; 
            font-family: Arial, Helvetica, sans-serif;
        }

        /* OVERLAY SETUP */
        .overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        .btn-tap { 
            border: 2px solid white; 
            padding: 10px 30px; 
            border-radius: 50px; 
            margin-top: 20px; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        /* MAIN CONTENT AREA */
        #content {
            display: none;
            width: 100%;
            height: 100vh;
            background: black;
            overflow: auto; /* Allow scroll */
        }

        /* THE TEXT PORTRAIT MAGIC */
        #text-layer {
            width: 100%;
            min-height: 100vh;
            
            /* FONT SETTINGS - PINALAKI PARA DI MUKHANG STATIC */
            font-family: 'Arial Black', 'Impact', sans-serif; 
            font-weight: 900; 
            text-transform: uppercase; /* ALL CAPS para mas visible */
            word-break: break-all;
            text-align: center;
            color: transparent;

            /* IMAGE MASKING */
            background-image: url('love.jpg');
            background-size: contain; /* Buong mukha makikita, walang crop */
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: local; /* Sasama ang image pag nag-scroll */
            
            -webkit-background-clip: text;
            background-clip: text;
            
            /* FILTER: ETO ANG SOLUSYON SA MADILIM NA PICTURE */
            filter: contrast(1.2) brightness(1.3); 

            /* Default PC Size */
            font-size: 14px; 
            line-height: 0.85;
            letter-spacing: -1px;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 768px) {
            #text-layer {
                /* Mas malaki ng onti sa mobile para di maging alikabok tingnan */
                font-size: 10px; 
                line-height: 0.8;
                letter-spacing: -0.5px;
                background-size: 100% auto; /* Full width sa mobile */
            }
        }
    </style>
</head>
<body>

    <div id="step1" class="overlay" onclick="revealGift()">
        <h1>CLICK TO OPEN 🎁</h1>
        <div class="btn-tap">Reveal Khate</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="content">
        <div id="text-layer"></div>
    </div>

    <script>
        const audio = document.getElementById("bgMusic");

        function revealGift() {
            const overlay = document.getElementById('step1');
            const content = document.getElementById('content');
            const layer = document.getElementById('text-layer');
            
            overlay.style.display = 'none';
            content.style.display = 'block';
            
            // Play Music
            audio.play().catch(e => console.log("Audio required interaction"));

            // TEXT GENERATION
            // Pinalitan ko ng UPPERCASE at paulit-ulit para kumapal
            const text = "ILOVEYOU "; 
            
            // Tantyahin ang dami base sa screen size para di lag
            const repeatCount = window.innerWidth < 768 ? 50000 : 100000;
            
            layer.innerText = text.repeat(repeatCount);
        }
    </script>
</body>
</html>
