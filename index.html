<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para sa Besty Ko</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .ascii-container {
            /* Dito ilagay ang path ng picture ng jowa mo */
            background-image: url('love.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            /* Dito nangyayari ang magic */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            /* Text setup */
            font-family: monospace;
            font-weight: 900;
            line-height: 0.8;
            font-size: 10px; /* Liitan mo pa 'to kung gusto mo mas detailed */
            width: 100vw;
            height: 100vh;
            word-break: break-all;
            text-align: justify;
            user-select: none;
        }

        /* Responsive zoom effect */
        .ascii-container:hover {
            cursor: zoom-in;
        }
    </style>
</head>
<body>

    <div class="ascii-container" id="textWall"></div>

    <script>
        const container = document.getElementById('textWall');
        const text = "iloveyou";
        const repeatCount = 50000; // Dami ng "iloveyou" para mapuno ang screen
        
        // Bubuo ng mahabang wall of text
        container.innerText = text.repeat(repeatCount);
    </script>
</body>
</html>
