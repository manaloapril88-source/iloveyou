<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You Khate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: black;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        /* --- OVERLAYS --- */
        #intro-overlay, #message-overlay, #music-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            text-align: center;
            padding: 30px;
        }

        #message-overlay, #music-overlay { display: none; } 

        /* --- MAIN CONTENT --- */
        .main-wrapper {
            position: relative;
            width: 100%;
            display: none;
            /* Ito ang magdidikta kung gaano kahaba ang scroll sa CP */
            height: 300vh; 
        }

        #text-layer {
            position: fixed; /* Naka-fix para habang nag-scroll, nandun lang ang image */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: monospace;
            font-weight: 900;
            word-break: break-all;
            text-align: justify;
            color: transparent;

            background-image: url('love.jpg');
            background-size: cover; /* Eto ang magpapa-Full Screen sa CP nang hindi stretched */
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            -webkit-background-clip: text;
            background-clip: text;
            
            /* Siksik na text settings */
            font-size: 5px;
            line-height: 0.8;
            letter-spacing: -1px;
            z-index: 1;
        }

        /* Scroll Progress Bar (Para alam niyang nag-scroll siya) */
        #progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: #ff4d4d;
            z-index: 1001;
            width: 0%;
        }

        @media (max-width: 768px) {
            #text-layer {
                font-size: 4px; /* Mas pino para sa mobile screen */
                line-height: 0.75;
            }
            h1 { font-size: 1.4rem; }
        }

        h1 { margin-bottom: 15px; letter-spacing: 2px; line-height: 1.2; }
        .btn-tap { border: 1px solid white; padding: 12px 25px; border-radius: 30px; margin-top: 20px; font-weight: bold; }
        .khate-text { color: #ff4d4d; font-style: italic; }
    </style>
</head>
<body>

    <div id="progress"></div>

    <div id="intro-overlay" onclick="toMessage()">
        <h1>CLICK TO OPEN 🎁</h1>
        <p>(Please turn up your volume 🔊)</p>
    </div>

    <div id="message-overlay" onclick="toMusic()">
        <h1 style="color: #ff4d4d;">You're my favorite person.</h1>
        <h3 style="color: white; font-weight: normal; margin-bottom: 20px;">Sana nagustuhan mo 'to.</h3>
        <p class="btn-tap">Next</p>
    </div>

    <div id="music-overlay" onclick="startGift()">
        <h1>Play your favorite music and enjoy <span class="khate-text">khate!</span></h1>
        <p class="btn-tap">Tap to reveal 💖</p>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper" id="content">
        <div id="text-layer"></div>
    </div>

    <script>
        const audio = document.getElementById("bgMusic");

        function toMessage() {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('message-overlay').style.display = 'flex';
            audio.load();
        }

        function toMusic() {
            document.getElementById('message-overlay').style.display = 'none';
            document.getElementById('music-overlay').style.display = 'flex';
        }

        function startGift() {
            document.getElementById('music-overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            fillScreen();
            audio.play().catch(e => console.log("Audio waiting..."));
        }

        function fillScreen() {
            const layer = document.getElementById('text-layer');
            const text = "iloveyou";
            // Pinupuno natin ng malupit na amount ng text para mahaba ang scroll
            layer.innerText = text.repeat(300000); 
        }

        // Scroll Progress logic
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress").style.width = scrolled + "%";
            
            // Re-trigger play on scroll kung sakaling ayaw pa rin
            if (audio.paused) { audio.play(); }
        };

        // Emergency click
        window.onclick = function() {
            if (document.getElementById('content').style.display === 'block' && audio.paused) {
                audio.play();
            }
        };
    </script>
</body>
</html>
