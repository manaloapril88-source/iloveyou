<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para sa Paborito Ko</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Overlay bago mag-start */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            cursor: pointer;
            font-family: sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 800px; /* Nilimitahan ko ang lapad para hindi "stretch" ang mukha */
            line-height: 0; /* Tinatanggal ang extra space sa ilalim ng letters */
        }

        #textWall {
            /* 1. Image mo dito */
            background-image: url('love.jpg'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            
            /* 2. Masking */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            /* 3. Font Settings (In-adjust para hindi patong-patong) */
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 8px; 
            line-height: 1; /* Ginawang 1 para sakto ang patong */
            letter-spacing: 0px; /* Ginawang 0 para mabasa ang text */
            
            word-break: break-all;
            text-align: justify;
            width: 100%;
            display: block;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startGift()">
        <div style="text-align: center;">
            <h1 style="font-weight: 100; letter-spacing: 5px;">PARA SA'YO</h1>
            <p style="font-size: 10px; opacity: 0.5;">CLICK ANYWHERE</p>
        </div>
    </div>

    <audio id="mySong" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="textWall"></div>
    </div>

    <script>
        function startGift() {
            document.getElementById('mySong').play();
            document.getElementById('overlay').style.display = 'none';
            generateText();
        }

        function generateText() {
            const container = document.getElementById('textWall');
            const textToRepeat = "iloveyou";
            
            // 4. Kalkulasyon para hindi lumampas ang scroll
            // Kukunin natin ang sukat ng screen para punuin lang ang space
            const charWidth = 5; // estimate width ng isang letter
            const charHeight = 8; // estimate height ng isang letter
            const area = (window.innerWidth * window.innerHeight * 5); // estimate multiplier
            
            const totalCharsNeeded = Math.floor(area / textToRepeat.length);
            
            // Bubuo ng text na sakto lang
            container.innerText = textToRepeat.repeat(totalCharsNeeded);
        }

        // Re-generate text pag nag-resize ang window para iwas black space
        window.onresize = generateText;
    </script>

</body>
</html>
